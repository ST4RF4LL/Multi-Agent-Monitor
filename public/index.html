<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Agent Monitor</title>
    <meta name="description" content="Web-based monitor for orchestrating multiple OpenCode instances via opencode serve" />
    <link rel="stylesheet" href="index.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>" />
  </head>
  <body>
    <div id="app">
      <!-- Setup Screen -->
      <div id="setup-screen">
        <div class="setup-container">
          <div class="setup-logo">
            <h1>🔮 Multi-Agent Monitor</h1>
            <p>OpenCode 多实例并行审计监控器</p>
          </div>
          <div class="setup-card">
            <div class="form-group">
              <label>⚙️ OpenCode 设置目录</label>
              <input type="text" id="input-opencode-root" placeholder="/path/to/opencode-agent-config" spellcheck="false" />
              <div class="hint">存放 OpenCode agent/config 文件的目录</div>
            </div>
            <div class="form-group">
              <label>📁 被测项目根目录</label>
              <input type="text" id="input-project-root" placeholder="/path/to/your/microservices" spellcheck="false" />
              <div class="hint">递归查找此目录下的 Git 仓库</div>
            </div>
            <div class="form-group">
              <label>📝 审计 Prompt</label>
              <textarea id="input-audit-prompt" placeholder="请对当前微服务项目进行全面的安全审计..." spellcheck="false"></textarea>
              <div class="hint">统一下发给每个 OpenCode 实例的审计指令</div>
            </div>
            <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
              <div class="form-group">
                <label>⚡ 最大并发数</label>
                <input type="number" id="input-max-concurrent" value="3" min="1" max="20" />
                <div class="hint">同时运行的审计实例数</div>
              </div>
              <div class="form-group">
                <label>🤖 模型设置</label>
                <input type="text" id="input-model" list="model-list" placeholder="留空使用默认" />
                <datalist id="model-list"></datalist>
                <div class="hint">例如: gpt-4o</div>
              </div>
            </div>
            <button class="btn btn-primary btn-lg btn-full" id="btn-launch" onclick="App.launch()">🚀 扫描并启动</button>
          </div>
        </div>
      </div>

      <!-- Monitor Screen -->
      <div id="monitor-screen" style="display:none;flex-direction:column;height:100vh">
        <div class="toolbar">
          <div class="toolbar-brand">
            <span class="icon">🔮</span>
            <span>Multi-Agent Monitor</span>
          </div>
          <div class="toolbar-stats" id="toolbar-stats"></div>
          <div class="toolbar-actions">
            <button class="btn btn-refresh-on btn-sm" id="btn-auto-refresh" onclick="App.toggleAutoRefresh()">⟳ 自动刷新: 开</button>
            <select id="global-model-select" class="model-select" onchange="App.setGlobalModel(this.value)">
              <option value="">-- 全局模型 --</option>
            </select>
            <button class="btn btn-audit btn-sm" id="btn-start-audit" onclick="App.startBatchAudit()">▶ 批量审计</button>
            <button class="btn btn-pause btn-sm hidden" id="btn-pause" onclick="App.pauseAudit()">⏸ 暂停</button>
            <button class="btn btn-resume btn-sm hidden" id="btn-resume" onclick="App.resumeAudit()">▶ 继续</button>
            <button class="btn btn-ghost btn-sm" onclick="App.stopAllInstances()">停止全部</button>
            <button class="btn btn-ghost btn-sm" onclick="App.toggleSettings()">⚙ 设置</button>
          </div>
        </div>

        <div class="queue-bar hidden" id="queue-bar">
          <span id="queue-text">队列: 0/0</span>
          <div class="queue-progress-track"><div class="queue-progress-fill" id="queue-fill" style="width:0%"></div></div>
          <span id="queue-percent">0%</span>
        </div>

        <!-- Settings overlay -->
        <div class="settings-overlay hidden" id="settings-overlay">
          <div class="settings-panel">
            <div class="settings-header">
              <h3>⚙ 设置</h3>
              <button class="btn btn-ghost btn-sm" onclick="App.toggleSettings()">✕ 关闭</button>
            </div>
            <div class="settings-body">
              <div class="form-group">
                <label>📝 审计 Prompt</label>
                <textarea id="settings-audit-prompt" rows="4" spellcheck="false"></textarea>
              </div>
              <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                  <label>⚡ 最大并发数</label>
                  <input type="number" id="settings-max-concurrent" value="3" min="1" max="20" />
                </div>
                <div class="form-group">
                  <label>🤖 全局模型</label>
                  <input type="text" id="settings-model" list="model-list-settings" placeholder="留空使用默认" />
                  <datalist id="model-list-settings"></datalist>
                </div>
              </div>
              <button class="btn btn-primary btn-sm btn-full" onclick="App.saveSettings()">💾 保存设置</button>
            </div>
          </div>
        </div>

        <div class="main-layout">
          <!-- Left: Instance List -->
          <div class="instance-panel">
            <div class="panel-header">
              <h2>📦 实例列表</h2>
              <span id="instance-count" style="font-size:0.75rem;color:var(--text-muted)">0 个服务</span>
            </div>
            <div class="instance-list" id="instance-list"></div>
          </div>

          <!-- Right: Chat Panel -->
          <div class="chat-panel" id="chat-panel">
            <div class="chat-empty" id="chat-empty">
              <div class="empty-icon">💬</div>
              <h3>选择一个实例</h3>
              <p>点击左侧实例卡片，在此发送交互指令到终端</p>
            </div>

            <div id="chat-content" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
              <div class="chat-header">
                <span class="chat-header-name" id="instance-name-display">-</span>
                <span class="chat-header-status" id="instance-status-display">-</span>
                <span style="flex:1"></span>
                <div class="chat-header-actions">
                  <button class="btn btn-danger btn-sm" onclick="App.abortAudit()">⏹ 中止</button>
                </div>
              </div>

              <div class="chat-messages" id="chat-messages">
                <div style="text-align:center;color:var(--text-muted);padding:2rem;">
                  <p>📝 在此输入消息，选中实例后发送到对应 session</p>
                </div>
              </div>

              <div class="chat-input-area">
                <div class="chat-input-wrapper">
                  <textarea id="chat-input" rows="1" placeholder="输入消息发送到此终端实例..." onkeydown="App.onChatKeyDown(event)"></textarea>
                  <button class="chat-send-btn" onclick="App.sendMessage()">➤</button>
                </div>
                <div class="chat-input-controls">
                  <span>实例模型:</span>
                  <select id="instance-model-select" class="model-select" onchange="App.setInstanceModel(this.value)">
                    <option value="">系统默认</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>
    <script src="app.js"></script>
  </body>
</html>
