<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Terminal | MAM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a0e17; }
    #terminal-bar {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.35rem 0.75rem;
      background: #111827; border-bottom: 1px solid rgba(100,116,139,0.2);
      color: #94a3b8; font-family: 'Inter', -apple-system, sans-serif;
      font-size: 0.78rem; flex-shrink: 0;
    }
    #terminal-bar .name { font-weight: 600; color: #e2e8f0; }
    #terminal-bar .status { font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 8px; }
    #terminal-bar .status.ready { background: rgba(34,211,238,0.15); color: #22d3ee; }
    #terminal-bar .status.auditing { background: rgba(16,185,129,0.15); color: #10b981; }
    #terminal-bar .status.error { background: rgba(239,68,68,0.15); color: #f87171; }
    #terminal-bar .status.stopped { background: rgba(100,116,139,0.15); color: #64748b; }
    #terminal-bar .spacer { flex: 1; }
    #terminal-bar .session { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: #64748b; }
    #terminal-container { flex: 1; overflow: hidden; padding: 2px; }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;">
  <div id="terminal-bar">
    <span class="name" id="inst-name">-</span>
    <span class="status stopped" id="inst-status">-</span>
    <span class="spacer"></span>
    <span class="session" id="inst-session">mam-</span>
  </div>
  <div id="terminal-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      let instanceId = params.get('id');
      if (!instanceId) {
        const parts = window.location.pathname.split('/').filter(Boolean);
        if (parts.length >= 2 && parts[parts.length - 1] !== 'terminal') {
          instanceId = parts[parts.length - 1];
        }
      }
      if (!instanceId) { document.body.innerHTML = '<p style="color:red;padding:2rem;">Missing instance id</p>'; return; }

      const sessionId = 'mam-' + instanceId;
      document.getElementById('inst-session').textContent = sessionId;
      document.title = 'Terminal | ' + instanceId;

      // Fetch instance info for header
      fetch('/api/instances/' + encodeURIComponent(instanceId))
        .then(r => r.json())
        .then(inst => {
          document.getElementById('inst-name').textContent = inst.name || instanceId;
          const el = document.getElementById('inst-status');
          const labels = { stopped: '已停止', starting: '启动中', ready: '就绪', auditing: '审计中', completed: '已完成', error: '错误' };
          el.textContent = labels[inst.status] || inst.status;
          el.className = 'status ' + inst.status;
          document.title = (inst.name || instanceId) + ' | Terminal | MAM';
        })
        .catch(() => {});

      const term = new Terminal({
        cursorBlink: true, cursorStyle: 'bar', fontSize: 14,
        fontFamily: "'JetBrains Mono', 'Cascadia Code', monospace",
        theme: {
          background: '#0a0e17', foreground: '#e2e8f0', cursor: '#38bdf8',
          selectionBackground: 'rgba(56, 189, 248, 0.3)',
          black: '#1e293b', red: '#f87171', green: '#34d399', yellow: '#fbbf24',
          blue: '#60a5fa', magenta: '#a78bfa', cyan: '#22d3ee', white: '#e2e8f0',
          brightBlack: '#475569', brightRed: '#fca5a5', brightGreen: '#6ee7b7',
          brightYellow: '#fcd34d', brightBlue: '#93c5fd', brightMagenta: '#c4b5fd',
          brightCyan: '#67e8f9', brightWhite: '#f8fafc',
        },
        scrollback: 20000,
      });

      const fitAddon = new FitAddon.FitAddon();
      term.loadAddon(fitAddon);
      term.open(document.getElementById('terminal-container'));
      fitAddon.fit();

      const container = document.getElementById('terminal-container');
      new ResizeObserver(() => {
        fitAddon.fit();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      }).observe(container);

      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = proto + '//' + window.location.host + '/terminals/ws?id=' + encodeURIComponent(instanceId);
      let ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        term.write('\x1b[2J\x1b[H');
        term.write('\x1b[32m✓ 已连接 ' + sessionId + '\x1b[0m\r\n\r\n');
        // Sync dimensions immediately
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      };

      ws.onmessage = (e) => { term.write(e.data); };

      ws.onclose = () => {
        term.write('\r\n\x1b[31m✗ 连接断开 — 实例可能已停止\x1b[0m\r\n');
      };

      ws.onerror = () => {
        term.write('\r\n\x1b[31m✗ 连接错误\x1b[0m\r\n');
      };

      term.onData((data) => {
        if (ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data }));
        }
      });
    })();
  </script>
</body>
</html>
